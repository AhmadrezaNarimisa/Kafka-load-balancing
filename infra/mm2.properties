# MirrorMaker 2: replicate orders-topic from Cluster A -> Cluster B
clusters = A, B

A.bootstrap.servers = kafka-a:29092
B.bootstrap.servers = kafka-b:29092

# replication direction
A->B.enabled = true
B->A.enabled = false
A->B.topics = orders-topic
A->B.groups = .*

# keep the same topic name on the secondary cluster so the app can fail over
# consumers transparently (rename.policy identity)
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# migrate consumer group offsets so failover consumption starts where A stopped
A->B.sync.group.offsets.enabled = true
A->B.sync.group.offsets.interval.seconds = 5
emit.interval.seconds = 5
refresh.topics.enabled = true
refresh.topics.interval.seconds = 5

# dedicated MM2 internal topics replication factor
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

tasks.max = 4
